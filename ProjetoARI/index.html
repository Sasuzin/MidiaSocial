<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem Social</title>
  <link rel="icon" href="Imagens/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d4aff">
  <script>
    // Logado vai para a linha do tempo; caso contrário, para o login/cadastro.
    var logado = false;
    try { logado = !!localStorage.getItem('usuarioLogado'); } catch (e) {}
    location.replace(logado ? 'home.html' : 'form.html');
  </script>
</head>
<body>
  <noscript>O Bem Social precisa de JavaScript. <a href="form.html">Entrar</a></noscript>
</body>
</html>
